  <body class="bg-slate-50 text-slate-900 antialiased">
    <div id="root"></div>
  <script>
    // CRITICAL: Intercept console.error BEFORE any modules load to prevent "Cannot convert object to primitive value" errors
    (function() {
      if (typeof console !== 'undefined' && console.error) {
        const originalConsoleError = console.error.bind(console);
        console.error = function(...args) {
          try {
            const safeArgs = args.map(function(arg) {
              if (arg === null || arg === undefined) return String(arg);
              if (typeof arg === 'object') {
                try {
                  if (arg instanceof Error) return arg.message || String(arg);
                  try { return JSON.stringify(arg); } catch(e) { return String(arg); }
                } catch(e) { return '[Object]'; }
              }
              return String(arg);
            });
            originalConsoleError.apply(console, safeArgs);
          } catch(e) {
            try { originalConsoleError('[ERROR] Logging failed'); } catch(e2) {}
          }
        };
      }
    })();
  </script>
  <script type="module" src="/index.tsx"></script>
